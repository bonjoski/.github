name: Verify Local Cryptographic Receipts (SLSA v1.0 & CycloneDX)

# Reusable open-source Stage 4 verification workflow.
# Verifies portable local receipts generated by soulcaster (SLSA v1.0 / in-toto)
# and bomhound (CycloneDX SBOM) using standard open-source tools — zero SaaS or
# centralized control plane required.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      provenance_path:
        description: "Path or glob to local SLSA v1.0 / in-toto provenance receipt (.intoto.jsonl or .json)"
        required: false
        type: string
        default: "receipts/provenance.intoto.jsonl"
      sbom_path:
        description: "Path to CycloneDX SBOM JSON generated by bomhound"
        required: false
        type: string
        default: "receipts/sbom.cdx.json"
      require_provenance:
        description: "Fail workflow if provenance receipt is absent"
        required: false
        type: boolean
        default: false
      require_sbom:
        description: "Fail workflow if CycloneDX SBOM is absent"
        required: false
        type: boolean
        default: false
      verify_git_signature:
        description: "Check whether HEAD commit carries a cryptographic signature"
        required: false
        type: boolean
        default: false
      blpr_dir:
        description: "Optional path to BLPR-v1 DSSE local provenance receipts directory"
        required: false
        type: string
        default: ""
      require_blpr:
        description: "Fail workflow if blpr_dir contains zero valid BLPR-v1 receipts"
        required: false
        type: boolean
        default: false

jobs:
  verify-local-receipts:
    name: Verify Local SLSA v1.0 & CycloneDX Receipts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Verify SLSA v1.0 / in-toto Provenance Receipt
        env:
          PROVENANCE_PATH: ${{ inputs.provenance_path }}
          REQUIRE_PROVENANCE: ${{ inputs.require_provenance }}
        run: |
          set -euo pipefail
          if [ ! -f "$PROVENANCE_PATH" ]; then
            if [ "$REQUIRE_PROVENANCE" = "true" ]; then
              echo "::error::Missing required local provenance receipt at $PROVENANCE_PATH (generate with soulcaster receipt)"
              exit 1
            fi
            echo "No local provenance receipt found at $PROVENANCE_PATH (optional; skipping)."
            exit 0
          fi

          python3 - "$PROVENANCE_PATH" <<'PY'
          import base64, json, sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as fh:
              lines = [ln.strip() for ln in fh if ln.strip()]

          if not lines:
              sys.exit(f"Empty provenance receipt: {path}")

          for idx, raw in enumerate(lines, 1):
              doc = json.loads(raw)
              # Support either DSSE envelope wrapping an in-toto statement or a raw in-toto statement
              if "payload" in doc and "payloadType" in doc:
                  stmt = json.loads(base64.b64decode(doc["payload"]).decode("utf-8"))
              else:
                  stmt = doc

              stmt_type = stmt.get("_type", "")
              pred_type = stmt.get("predicateType", "")
              if not stmt_type.startswith("https://in-toto.io/Statement/"):
                  sys.exit(f"Line {idx}: invalid in-toto Statement _type: {stmt_type!r}")
              if "slsa.dev/provenance/v1" not in pred_type:
                  sys.exit(f"Line {idx}: expected SLSA v1.0 predicateType, got: {pred_type!r}")
              subjects = stmt.get("subject", [])
              if not isinstance(subjects, list) or len(subjects) == 0:
                  sys.exit(f"Line {idx}: in-toto statement has no subject digests")
              for s in subjects:
                  if not s.get("name") or not s.get("digest"):
                      sys.exit(f"Line {idx}: subject missing name or digest: {s!r}")

          print(f"✔ Verified {len(lines)} local SLSA v1.0 / in-toto receipt(s) in {path}")
          PY

      - name: Verify CycloneDX SBOM Receipt
        env:
          SBOM_PATH: ${{ inputs.sbom_path }}
          REQUIRE_SBOM: ${{ inputs.require_sbom }}
        run: |
          set -euo pipefail
          if [ ! -f "$SBOM_PATH" ]; then
            if [ "$REQUIRE_SBOM" = "true" ]; then
              echo "::error::Missing required CycloneDX SBOM at $SBOM_PATH (generate with bomhound)"
              exit 1
            fi
            echo "No CycloneDX SBOM found at $SBOM_PATH (optional; skipping)."
            exit 0
          fi

          python3 - "$SBOM_PATH" <<'PY'
          import json, sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as fh:
              doc = json.load(fh)

          if doc.get("bomFormat") != "CycloneDX":
              sys.exit(f"Invalid bomFormat in {path}: expected 'CycloneDX', got {doc.get('bomFormat')!r}")
          spec = str(doc.get("specVersion", ""))
          if not spec:
              sys.exit(f"Missing specVersion in CycloneDX SBOM: {path}")
          components = doc.get("components", [])
          if not isinstance(components, list):
              sys.exit(f"Invalid components list in CycloneDX SBOM: {path}")

          print(f"✔ Verified CycloneDX {spec} SBOM in {path} ({len(components)} components)")
          PY

      - name: Check HEAD Commit Signature Presence
        if: ${{ inputs.verify_git_signature }}
        run: |
          set -euo pipefail
          sig_status="$(git log -1 --format='%G?')"
          echo "HEAD commit signature status: $sig_status"
          if [ "$sig_status" = "N" ]; then
            echo "::error::HEAD commit is unsigned. Sign commits locally with 'git commit -S' (or locksmith git-sign)."
            exit 1
          fi
          echo "✔ HEAD commit carries a cryptographic signature (status: $sig_status)"

      - name: Verify Local BLPR-v1 DSSE Provenance Receipts
        if: ${{ inputs.blpr_dir != '' }}
        env:
          BLPR_DIR: ${{ inputs.blpr_dir }}
          REQUIRE_BLPR: ${{ inputs.require_blpr }}
        run: |
          set -euo pipefail
          python3 - "$BLPR_DIR" "$REQUIRE_BLPR" <<'PY'
          import base64, json, pathlib, sys

          root = pathlib.Path(sys.argv[1])
          require = sys.argv[2] == "true"
          if root.is_symlink():
              sys.exit(f"Refusing symlink BLPR receipt directory: {root}")
          files = sorted(root.rglob("*.dsse.json")) if root.is_dir() else []
          if not files:
              if require:
                  sys.exit(f"No BLPR-v1 *.dsse.json receipts found under {root}")
              print(f"No BLPR-v1 receipts found under {root} (optional; skipping).")
              sys.exit(0)

          for p in files:
              if p.is_symlink():
                  sys.exit(f"Refusing symlink receipt file: {p}")
              env = json.loads(p.read_text(encoding="utf-8"))
              if env.get("payloadType") != "application/vnd.in-toto+json" or not env.get("signatures"):
                  sys.exit(f"Invalid or unsigned DSSE envelope: {p}")
              stmt = json.loads(base64.b64decode(env["payload"]).decode("utf-8"))
              if stmt.get("_type") != "https://in-toto.io/Statement/v1":
                  sys.exit(f"Invalid in-toto _type in {p}")
              if stmt.get("predicateType") != "https://bonjoski.dev/attestation/paved-road/v1":
                  sys.exit(f"Invalid BLPR-v1 predicateType in {p}")
              pred = stmt.get("predicate", {})
              if pred.get("schema_version") != "1.0.0" or not pred.get("receipt_id", "").startswith("rcpt_"):
                  sys.exit(f"Invalid BLPR-v1 predicate metadata in {p}")
          print(f"✔ Verified {len(files)} BLPR-v1 DSSE receipt(s) under {root}")
          PY
