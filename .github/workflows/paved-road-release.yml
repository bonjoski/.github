name: Paved-Road Receipt-Based Release

# Reusable open-source Stage 4B receipt-based release workflow.
# Installs SHA-256-pinned soulcaster & bomhound binaries (fail-closed; zero silent skips),
# emits SLSA v1.0 / in-toto provenance via soulcaster, generates & enriches CycloneDX SBOMs
# with legal copyright attribution via bomhound, signs via Sigstore cosign, and optionally
# publishes a GitHub Release when triggered on a v* tag.
#
# Safe Harbor Scope: Single-repository open-source release template using
# standard OSS tools (SLSA, CycloneDX, Sigstore Cosign). Zero SaaS control plane.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      build_command:
        description: "Deterministic build command producing artifact_path"
        required: false
        type: string
        default: "go build -trimpath -o dist/app ./..."
      artifact_path:
        description: "Path to the built release binary or archive"
        required: false
        type: string
        default: "dist/app"
      provenance_path:
        description: "Output path for SLSA v1.0 / in-toto provenance JSONL receipt"
        required: false
        type: string
        default: "dist/provenance.intoto.jsonl"
      sbom_path:
        description: "Output path for CycloneDX SBOM JSON receipt"
        required: false
        type: string
        default: "dist/sbom.cdx.json"
      go_version:
        description: "Go toolchain version for build"
        required: false
        type: string
        default: "1.27"
      verify_git_signature:
        description: "Fail closed if the release commit lacks a cryptographic Git signature"
        required: false
        type: boolean
        default: true
      enable_cosign:
        description: "Install and run standard open-source Sigstore cosign keyless signing/verification"
        required: false
        type: boolean
        default: true
      publish_github_release:
        description: "Publish a GitHub Release with artifact, SHA256, SLSA receipt, CycloneDX SBOM, and cosign bundle"
        required: false
        type: boolean
        default: false

jobs:
  release-receipts:
    name: Build, Attest & Verify Release Receipts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Paved-Road pinned installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bonjoski/.github
          path: .paved-road-kit
          sparse-checkout: |
            scripts/install_bonjoski_tool.py
            scripts/pinned-tools.json
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}

      - name: Install SHA-256-verified soulcaster & bomhound (fail-closed)
        run: |
          set -euo pipefail
          python3 .paved-road-kit/scripts/install_bonjoski_tool.py \
            --manifest .paved-road-kit/scripts/pinned-tools.json \
            --dest "$HOME/.local/bin" \
            --github-path \
            soulcaster bomhound

      - name: Verify release commit cryptographic signature
        if: ${{ inputs.verify_git_signature }}
        run: |
          set -euo pipefail
          sig_status="$(git log -1 --format='%G?')"
          echo "Release HEAD commit signature status: $sig_status"
          if [ "$sig_status" = "N" ]; then
            echo "::error::Release commit is unsigned. Sign locally with 'git commit -S' or 'locksmith git-sign'."
            exit 1
          fi

      - name: Build artifact & emit soulcaster SLSA v1.0 provenance receipt
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          PROVENANCE_PATH: ${{ inputs.provenance_path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ARTIFACT_PATH")" "$(dirname "$PROVENANCE_PATH")"
          bash -euo pipefail -c "$BUILD_COMMAND"
          test -f "$ARTIFACT_PATH"
          sha256sum "$ARTIFACT_PATH" > "${ARTIFACT_PATH}.sha256"
          cat "${ARTIFACT_PATH}.sha256"
          soulcaster --version
          soulcaster receipt --artifact "$ARTIFACT_PATH" --out "$PROVENANCE_PATH"
          test -s "$PROVENANCE_PATH"

      - name: Verify SLSA v1.0 / in-toto provenance & TOCTOU digest integrity
        env:
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          PROVENANCE_PATH: ${{ inputs.provenance_path }}
        run: |
          set -euo pipefail
          sha256sum -c "${ARTIFACT_PATH}.sha256"
          python3 - "$PROVENANCE_PATH" "$ARTIFACT_PATH" <<'PY'
          import base64, hashlib, json, pathlib, sys

          prov_path, art_path = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          actual_sha256 = hashlib.sha256(art_path.read_bytes()).hexdigest()
          lines = [ln.strip() for ln in prov_path.read_text(encoding="utf-8").splitlines() if ln.strip()]
          if not lines:
              sys.exit(f"Empty provenance receipt: {prov_path}")

          matched_digest = False
          for idx, raw in enumerate(lines, 1):
              doc = json.loads(raw)
              stmt = json.loads(base64.b64decode(doc["payload"]).decode("utf-8")) if "payload" in doc else doc
              if not str(stmt.get("_type", "")).startswith("https://in-toto.io/Statement/"):
                  sys.exit(f"Line {idx}: invalid in-toto Statement _type")
              if "slsa.dev/provenance/v1" not in str(stmt.get("predicateType", "")):
                  sys.exit(f"Line {idx}: expected SLSA v1.0 predicateType")
              for subj in stmt.get("subject", []):
                  if subj.get("digest", {}).get("sha256") == actual_sha256:
                      matched_digest = True

          if not matched_digest:
              sys.exit(f"Provenance digest mismatch: expected sha256 {actual_sha256}")
          print(f"✔ Verified soulcaster SLSA v1.0 provenance and exact SHA-256 digest ({actual_sha256})")
          PY

      - name: Generate base CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: ${{ inputs.sbom_path }}

      - name: Enrich & verify CycloneDX SBOM legal attribution with bomhound
        env:
          SBOM_PATH: ${{ inputs.sbom_path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bomhound --version
          printf '%s\n' "$GH_TOKEN" | bomhound -token-stdin -in-place "$SBOM_PATH"
          python3 - "$SBOM_PATH" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          if doc.get("bomFormat") != "CycloneDX" or not doc.get("specVersion"):
              sys.exit("Invalid CycloneDX SBOM after bomhound enrichment")
          print(f"✔ Verified bomhound-enriched CycloneDX {doc['specVersion']} SBOM ({len(doc.get('components', []))} components)")
          PY

      - name: Emit GitHub SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ inputs.artifact_path }}

      - name: Install Sigstore cosign
        if: ${{ inputs.enable_cosign }}
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Sign and verify release artifact bundle with cosign
        if: ${{ inputs.enable_cosign }}
        env:
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          REPO_URI: "https://github.com/${{ github.repository }}/"
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "${ARTIFACT_PATH}.cosign.bundle" \
            "$ARTIFACT_PATH"
          cosign verify-blob \
            --bundle "${ARTIFACT_PATH}.cosign.bundle" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^${REPO_URI}" \
            "$ARTIFACT_PATH"

      - name: Publish GitHub Release with Verified Receipts
        if: ${{ inputs.publish_github_release && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          PROVENANCE_PATH: ${{ inputs.provenance_path }}
          SBOM_PATH: ${{ inputs.sbom_path }}
        run: |
          set -euo pipefail
          ASSETS=("$ARTIFACT_PATH" "${ARTIFACT_PATH}.sha256" "$PROVENANCE_PATH" "$SBOM_PATH")
          if [ -f "${ARTIFACT_PATH}.cosign.bundle" ]; then
            ASSETS+=("${ARTIFACT_PATH}.cosign.bundle")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --generate-notes --title "$TAG"
          fi

      - name: Upload verified release receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paved-road-release-receipts
          path: |
            ${{ inputs.artifact_path }}
            ${{ inputs.artifact_path }}.sha256
            ${{ inputs.artifact_path }}.cosign.bundle
            ${{ inputs.provenance_path }}
            ${{ inputs.sbom_path }}
          if-no-files-found: ignore
          retention-days: 30
