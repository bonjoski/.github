name: Paved-Road Diff-Only PR Gate

# Reusable open-source Stage 4A PR gate (<30s diff-only proven checks).
# Installs SHA-256-pinned bonjoski release binaries (fail-closed; zero silent skips),
# runs argus (dependency/slopsquat audit), soulcaster (differential AST patch gate),
# and optional aegisbox (local loopback AI-safety abuse-case suite), then formats
# strictly proven findings via scripts/format_fixforward_pr.py.
#
# Safe Harbor Scope: Single-repository open-source workflow template invoking
# local single-binary CLIs inside the repository's own runner. Zero SaaS,
# zero centralized control plane, zero fleet telemetry.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      base_ref:
        description: "Base git ref for diff-only checks (e.g. origin/main)"
        required: false
        type: string
        default: "origin/main"
      run_argus:
        description: "Run argus lockfile/diff supply-chain audit"
        required: false
        type: boolean
        default: true
      run_soulcaster:
        description: "Run soulcaster verify-patch on changed lines only"
        required: false
        type: boolean
        default: true
      run_aegisbox:
        description: "Run aegisbox test --ai-safety --allow-degraded-local --json against localhost target"
        required: false
        type: boolean
        default: false
      aegisbox_target:
        description: "Strictly local loopback target URL for aegisbox AI-safety checks"
        required: false
        type: string
        default: "http://127.0.0.1:8080"
      post_pr_comment:
        description: "Post sanitized Fix-Forward comment to PR in an isolated comment job"
        required: false
        type: boolean
        default: false
      pr_number:
        description: "Pull request number (required only when post_pr_comment is true)"
        required: false
        type: string
        default: ""
      fail_on_proven:
        description: "Fail the PR check if any proven finding is detected"
        required: false
        type: boolean
        default: true

jobs:
  diff-gate:
    name: Diff-Only Proven Checks (<30s)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_proven_findings: ${{ steps.format.outputs.has_proven_findings }}
      comment_b64: ${{ steps.format.outputs.comment_b64 }}
    steps:
      - name: Checkout repository diff context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Paved-Road kit scripts & pinned manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bonjoski/.github
          path: .paved-road-kit
          sparse-checkout: |
            scripts/format_fixforward_pr.py
            scripts/install_bonjoski_tool.py
            scripts/pinned-tools.json
          fetch-depth: 1
          persist-credentials: false

      - name: Cache SHA-pinned bonjoski binaries
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.local/bin
          key: bonjoski-tools-linux-amd64-${{ hashFiles('.paved-road-kit/scripts/pinned-tools.json') }}

      - name: Install SHA-256-verified bonjoski binaries (fail-closed)
        env:
          RUN_ARGUS: ${{ inputs.run_argus }}
          RUN_SOULCASTER: ${{ inputs.run_soulcaster }}
          RUN_AEGISBOX: ${{ inputs.run_aegisbox }}
        run: |
          set -euo pipefail
          TOOLS=()
          [ "$RUN_ARGUS" = "true" ] && TOOLS+=(argus)
          [ "$RUN_SOULCASTER" = "true" ] && TOOLS+=(soulcaster)
          [ "$RUN_AEGISBOX" = "true" ] && TOOLS+=(aegisbox)
          if [ "${#TOOLS[@]}" -gt 0 ]; then
            python3 .paved-road-kit/scripts/install_bonjoski_tool.py \
              --manifest .paved-road-kit/scripts/pinned-tools.json \
              --dest "$HOME/.local/bin" \
              --github-path \
              "${TOOLS[@]}"
          fi

      - name: Prepare report workspace
        run: |
          set -euo pipefail
          mkdir -p .paved-road
          echo '{"findings":[]}' > .paved-road/argus.json
          echo '{"findings":[]}' > .paved-road/soulcaster.json
          echo '{"findings":[]}' > .paved-road/aegisbox.json

      - name: Run argus supply-chain & slopsquat gate
        if: ${{ inputs.run_argus }}
        run: |
          set -euo pipefail
          argus --version
          if [ -f go.sum ] || [ -f package-lock.json ] || [ -f Cargo.lock ] || [ -f requirements.txt ]; then
            argus vet --lockfile --json > .paved-road/argus.raw || true
            if python3 -c 'import json, sys; json.load(open(sys.argv[1]))' .paved-road/argus.raw 2>/dev/null; then
              mv .paved-road/argus.raw .paved-road/argus.json
            fi
          fi

      - name: Run soulcaster diff-only AST patch gate
        if: ${{ inputs.run_soulcaster }}
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          soulcaster --version
          if git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            git diff "${BASE_REF}...HEAD" > .paved-road/pr.patch
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff HEAD~1..HEAD > .paved-road/pr.patch
          else
            : > .paved-road/pr.patch
          fi
          if [ -s .paved-road/pr.patch ]; then
            soulcaster verify-patch -patch .paved-road/pr.patch -json > .paved-road/soulcaster.raw || true
            if python3 -c 'import json, sys; json.load(open(sys.argv[1]))' .paved-road/soulcaster.raw 2>/dev/null; then
              mv .paved-road/soulcaster.raw .paved-road/soulcaster.json
            fi
          fi

      - name: Run aegisbox local AI-safety abuse-case suite
        if: ${{ inputs.run_aegisbox }}
        env:
          AEGISBOX_TARGET: ${{ inputs.aegisbox_target }}
        run: |
          set -euo pipefail
          case "$AEGISBOX_TARGET" in
            http://127.0.0.1*|http://localhost*|http://\[::1\]*)
              ;;
            *)
              echo "::error::Refusing non-loopback aegisbox_target (local loopback only)."
              exit 1
              ;;
          esac
          aegisbox --version
          aegisbox test --ai-safety --allow-degraded-local --target "$AEGISBOX_TARGET" --json > .paved-road/aegisbox.raw || true
          if python3 -c 'import json, sys; json.load(open(sys.argv[1]))' .paved-road/aegisbox.raw 2>/dev/null; then
            mv .paved-road/aegisbox.raw .paved-road/aegisbox.json
          fi

      - name: Format zero-noise Fix-Forward summary
        id: format
        env:
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAIL_ON_PROVEN: ${{ inputs.fail_on_proven }}
        run: |
          set -euo pipefail
          set +e
          python3 .paved-road-kit/scripts/format_fixforward_pr.py \
            --argus .paved-road/argus.json \
            --soulcaster .paved-road/soulcaster.json \
            --aegisbox .paved-road/aegisbox.json \
            --max-items 5 \
            --run-url "$RUN_URL" \
            --output .paved-road/pr-comment.md \
            --fail-on-proven
          rc=$?
          set -e

          cat .paved-road/pr-comment.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ]; then
            echo "has_proven_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proven_findings=false" >> "$GITHUB_OUTPUT"
          fi

          COMMENT_B64="$(python3 -c 'import base64, pathlib; data = pathlib.Path(".paved-road/pr-comment.md").read_bytes()[:8192]; print(base64.b64encode(data).decode("ascii"))')"
          echo "comment_b64=$COMMENT_B64" >> "$GITHUB_OUTPUT"

          if [ "$rc" -ne 0 ] && [ "$FAIL_ON_PROVEN" = "true" ]; then
            echo "::error::Paved-Road diff gate detected proven findings. Review the Fix-Forward summary above."
            exit 1
          fi

      - name: Upload sanitized Fix-Forward report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paved-road-fixforward-report
          path: .paved-road/pr-comment.md
          retention-days: 7

  post-fixforward-comment:
    name: Post Sanitized Fix-Forward PR Comment
    needs: [diff-gate]
    if: ${{ always() && inputs.post_pr_comment && inputs.pr_number != '' && needs.diff-gate.outputs.has_proven_findings == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post sanitized Fix-Forward comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_B64: ${{ needs.diff-gate.outputs.comment_b64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib, sys
          raw = base64.b64decode(os.environ["COMMENT_B64"].encode("ascii"))
          if len(raw) > 8192:
              sys.exit("Refusing oversized PR comment payload (>8 KiB)")
          pathlib.Path("pr-comment.md").write_bytes(raw)
          PY
          gh pr comment "$PR_NUMBER" --body-file pr-comment.md
