name: "Feature Story (Paved Road — 5-Question Blast-Radius Check)"
description: "Draft a user story with a 30-second, jargon-free 5-question safety trigger check. Zero checked boxes = zero security ceremony."
title: "[Story]: "
labels: ["feature", "paved-road"]
body:
  - type: markdown
    attributes:
      value: |
        ### Feature Story & 5-Question Blast-Radius Trigger Card
        Answer the 5 plain-English checkboxes below in under 30 seconds before sprint sizing.
        * **0 boxes checked:** Fast-track straight to development — **zero security ceremony**.
        * **1+ boxes checked:** Run `coppermind requirements` locally (100% offline CLI) to generate 2–3 plain-English `Given / When / Then` safety acceptance criteria and paste them into the section below.

  - type: textarea
    id: user_story
    attributes:
      label: User Story & Goal
      description: Describe the user outcome in plain English.
      placeholder: "As a support agent, I want an AI assistant to summarize customer tickets and issue refunds up to $50 so routine billing requests resolve faster."
    validations:
      required: true

  - type: textarea
    id: happy_path_ac
    attributes:
      label: Happy-Path Acceptance Criteria
      description: Core functional Given / When / Then outcomes.
      placeholder: |
        - Given an open billing ticket under $50,
        - When the support agent clicks "Draft & Refund",
        - Then the assistant summarizes the ticket and issues the refund.
    validations:
      required: true

  - type: checkboxes
    id: blast_radius_triggers
    attributes:
      label: 5-Question Plain-English Blast-Radius Trigger Card
      description: Check all that apply. Leave all unchecked for the zero-ceremony fast-track.
      options:
        - label: "Q1 (auth_data_money): Does this touch login, permissions, billing/money, or cross-customer data?"
        - label: "Q2 (ai_rag_context): Does this send text to an AI model or retrieve documents via vector/RAG search?"
        - label: "Q3 (ai_state_mutation): Can an AI call a tool or API that changes state (write, delete, refund, email, webhook)?"
        - label: "Q4 (supply_chain_mcp): Does this add a new third-party library, external API, or MCP tool server?"
        - label: "Q5 (secrets_pii): Does this store, log, or transmit API keys, credentials, or sensitive customer PII?"

  - type: markdown
    attributes:
      value: |
        #### Fast-Track vs. Local Abuse-Case Criteria
        * **Zero checked boxes above?** Skip the next box and move straight to development.
        * **One or more boxes checked?** Generate 2–3 sprint-ready criteria locally in `< 5ms` (story text stays 100% local and is never persisted):
          ```bash
          coppermind requirements --story "<paste your story>" --triggers <comma-separated-flags>
          ```

  - type: textarea
    id: safety_acceptance_criteria
    attributes:
      label: Safety Acceptance Criteria (Optional — Required Only If >=1 Trigger Checked)
      description: Paste the 2–3 plain-English Given / When / Then abuse-case criteria and local verify commands generated by `coppermind requirements`.
      placeholder: |
        1. **Enforce AI Action Caps in Code**
          - **Given** a ticket asks for a $500 refund,
          - **When** the AI calls the refund tool,
          - **Then** server code enforces the $50 cap.
          - *Verify:* `aegisbox test --ai-safety --tools`
    validations:
      required: false
